[project]
name = "market-intel"
version = "0.1.0"
description = "Personal market intelligence for Indian markets. Signals only, never real orders."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "pymongo>=4.20.0",
    "sqlalchemy>=2.1.9",
    "structlog>=26.1.0",
    "tzdata>=2026.6",
    "yfinance>=1.8.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "market_intel"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the real databases; skipped unless RUN_INTEGRATION=1 (CI compose-smoke)",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "nbstripout>=0.9.2",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
