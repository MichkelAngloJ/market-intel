name: Compose smoke

# A separate workflow because GitHub's path filter applies to a whole workflow; this keeps
# the main CI running on every push while this job runs only on database-related changes.
on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "src/market_intel/db/**"
      - "src/market_intel/db_check.py"
      - "src/market_intel/health.py"
      - "src/market_intel/ingestion.py"
      - "src/market_intel/instruments.py"
      - "src/market_intel/watchlist.py"
      - "src/market_intel/news.py"
      - "src/market_intel/source_health.py"
      - "src/market_intel/rate_limit.py"
      - "src/market_intel/candles.py"
      - "src/market_intel/intraday_candles.py"
      - "src/market_intel/intraday.py"
      - "src/market_intel/intraday_strategies.py"
      - "src/market_intel/intraday_backtest.py"
      - "src/market_intel/intraday_models.py"
      - "src/market_intel/intraday_run.py"
      - "src/market_intel/universe.py"
      - "src/market_intel/sizing.py"
      - "src/market_intel/upstox.py"
      - "src/market_intel/features.py"
      - "src/market_intel/feature_spec.py"
      - "scripts/fake_market_data.py"
      - "src/market_intel/models.py"
      - "src/market_intel/evaluation.py"
      - "src/market_intel/costs.py"
      - "src/market_intel/explain.py"
      - "config/news_feeds.toml"
      - "src/market_intel/sources/**"
      - "src/market_intel/mongo/**"
      - "src/market_intel/mongo_setup.py"
      - "src/market_intel/config.py"
      - "migrations/**"
      - "alembic.ini"
      - "tests/integration/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/compose-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "src/market_intel/db/**"
      - "src/market_intel/db_check.py"
      - "src/market_intel/health.py"
      - "src/market_intel/ingestion.py"
      - "src/market_intel/instruments.py"
      - "src/market_intel/watchlist.py"
      - "src/market_intel/news.py"
      - "src/market_intel/source_health.py"
      - "src/market_intel/rate_limit.py"
      - "src/market_intel/candles.py"
      - "src/market_intel/intraday_candles.py"
      - "src/market_intel/intraday.py"
      - "src/market_intel/intraday_strategies.py"
      - "src/market_intel/intraday_backtest.py"
      - "src/market_intel/intraday_models.py"
      - "src/market_intel/intraday_run.py"
      - "src/market_intel/universe.py"
      - "src/market_intel/sizing.py"
      - "src/market_intel/upstox.py"
      - "src/market_intel/features.py"
      - "src/market_intel/feature_spec.py"
      - "scripts/fake_market_data.py"
      - "src/market_intel/models.py"
      - "src/market_intel/evaluation.py"
      - "src/market_intel/costs.py"
      - "src/market_intel/explain.py"
      - "config/news_feeds.toml"
      - "src/market_intel/sources/**"
      - "src/market_intel/mongo/**"
      - "src/market_intel/mongo_setup.py"
      - "src/market_intel/config.py"
      - "migrations/**"
      - "alembic.ini"
      - "tests/integration/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/compose-smoke.yml"

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag after v7, so pin the exact release.
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Generate throwaway credentials
        # Random per run, masked in logs, never committed. Hex is URL-safe.
        run: |
          umask 077
          pg_pw=$(openssl rand -hex 24)
          pg_app_pw=$(openssl rand -hex 24)
          root_pw=$(openssl rand -hex 24)
          app_pw=$(openssl rand -hex 24)
          setup_pw=$(openssl rand -hex 24)
          echo "::add-mask::$pg_pw"
          echo "::add-mask::$pg_app_pw"
          echo "::add-mask::$root_pw"
          echo "::add-mask::$app_pw"
          echo "::add-mask::$setup_pw"
          {
            echo "POSTGRES_USER=market_intel"
            echo "POSTGRES_PASSWORD=$pg_pw"
            echo "POSTGRES_DB=market_intel"
            echo "PG_APP_PASSWORD=$pg_app_pw"
            echo "MONGO_INITDB_ROOT_USERNAME=root"
            echo "MONGO_INITDB_ROOT_PASSWORD=$root_pw"
            echo "MONGO_APP_USER=market_intel_app"
            echo "MONGO_APP_PASSWORD=$app_pw"
            echo "MONGO_SETUP_USER=market_intel_setup"
            echo "MONGO_SETUP_PASSWORD=$setup_pw"
          } > docker/compose.env
          {
            echo "APP_PROFILE=full"
            echo "ALERT_DRY_RUN=true"
            # Owner (superuser here) for migrations only; the app and tests use mi_app.
            echo "POSTGRES_ADMIN_URL=postgresql://market_intel:$pg_pw@127.0.0.1:5432/market_intel"
            echo "POSTGRES_URL=postgresql://mi_app:$pg_app_pw@127.0.0.1:5432/market_intel"
            # Both Mongo users live in admin, as on Atlas.
            echo "MONGODB_URI=mongodb://market_intel_app:$app_pw@127.0.0.1:27017/market_intel?authSource=admin"
            echo "MONGODB_ADMIN_URI=mongodb://market_intel_setup:$setup_pw@127.0.0.1:27017/market_intel?authSource=admin"
          } > .env

      - name: Start databases
        run: |
          docker compose -f docker/compose.yaml --env-file docker/compose.env up -d --wait --wait-timeout 180
          docker compose -f docker/compose.yaml --env-file docker/compose.env ps

      - name: Install dependencies
        run: uv sync --locked

      # Twice: the second run must find nothing to change (idempotent, never drops).
      - name: MongoDB setup (twice)
        run: |
          uv run python -m market_intel.mongo_setup
          uv run python -m market_intel.mongo_setup | tee mongo_setup_2.txt
          grep -q "nothing to change" mongo_setup_2.txt

      # Prove every migration applies, undoes and re-applies cleanly (CI only: a downgrade
      # drops tables, so it is never run on real data).
      - name: Migrations up, down, up
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic current

      - name: No drift between schema.py and migrations
        run: uv run alembic check

      - name: Integration tests (Postgres and MongoDB rights, audit append-only)
        env:
          RUN_INTEGRATION: "1"
        run: uv run pytest -m integration -v

      # The real refresh command on a small FAKE instrument file (fake ISINs, no download):
      # the second run on the same file must make 0 changes.
      - name: Instruments refresh from a fake file (twice)
        env:
          ALERT_DRY_RUN: "true"
        run: |
          uv run python -c "
          import gzip, json, sys
          eq = [{'segment': 'NSE_EQ', 'instrument_type': s, 'isin': f'ZZTEST{n:05d}1',
                 'instrument_key': f'NSE_EQ|ZZTEST{n:05d}1', 'trading_symbol': f'ZZCI{n}',
                 'name': 'FAKE', 'lot_size': 1, 'tick_size': 5.0}
                for n, s in enumerate(['EQ', 'EQ', 'BE'])]
          idx = [{'segment': 'NSE_INDEX', 'instrument_type': 'INDEX',
                  'instrument_key': 'NSE_INDEX|ZZ CI 50', 'trading_symbol': 'ZZ CI 50'}]
          open(sys.argv[1], 'wb').write(gzip.compress(json.dumps(eq + idx).encode()))
          " "$RUNNER_TEMP/fake.json.gz"
          uv run python -m market_intel.instruments refresh --file "$RUNNER_TEMP/fake.json.gz"
          uv run python -m market_intel.instruments refresh --file "$RUNNER_TEMP/fake.json.gz" | tee refresh_2.txt
          grep -q "instruments refresh: 0 changes" refresh_2.txt

      # Features v1, labels and the leakage test on SYNTHETIC candles (the script refuses a
      # database that already holds candles). check-leakage fails the job if leakage is found.
      - name: Features, labels and leakage test on fake data
        env:
          ALERT_DRY_RUN: "true"
        run: |
          uv run python scripts/fake_market_data.py
          uv run python -m market_intel.features build
          uv run python -m market_intel.features labels
          uv run python -m market_intel.features check-leakage --sample 40

      # S4i: intraday features v1, triple-barrier labels and the intraday leakage test on the
      # SYNTHETIC 1-minute bars from the same script (never Upstox). A leak fails the job.
      - name: Intraday features, labels and leakage test on fake data
        env:
          ALERT_DRY_RUN: "true"
        run: |
          uv run python -m market_intel.intraday features build
          uv run python -m market_intel.intraday labels build
          uv run python -m market_intel.intraday check-leakage --sample 40

      # S5i: volatility-scaled labels, the rule baselines against "no trading" after costs, a
      # tiny meta-model (the fake month is far too small for the real settings) and a replay.
      # CI never calls Upstox and never places an order.
      - name: Intraday strategies, backtest, meta-model and replay on fake data
        env:
          ALERT_DRY_RUN: "true"
        run: |
          uv run python -m market_intel.intraday labels build --version v2
          uv run python -m market_intel.intraday backtest --labels v2 --variant k15_b10             --capital 100000 | tee backtest.txt
          grep -q "no_trading" backtest.txt
          uv run python -m market_intel.intraday train --labels v2 --variant k15_b10             --window-months 1 --holdout-months 1 --min-train-rows 200             --max-train-rows 20000 --no-mlflow
          uv run python -m market_intel.intraday report | tee report.txt
          grep -q "orb_15" report.txt
          uv run python -m market_intel.intraday replay --capital 100000 | tee replay.txt
          grep -qE "day total|no signals" replay.txt

      # S5i-b: the longer-hold labels, their leakage test, the confidence calibration and the
      # percentage reporting, all on the same fake data.
      - name: Intraday longer hold, calibration and percentage reporting on fake data
        env:
          ALERT_DRY_RUN: "true"
        run: |
          uv run python -m market_intel.intraday labels build --version v3
          uv run python -m market_intel.intraday check-leakage --labels v3 --sample 20
          uv run python -m market_intel.intraday backtest --labels v3 --variant k15_bcl             --capital 100000 | tee backtest_v3.txt
          grep -q "no_trading" backtest_v3.txt
          uv run python -m market_intel.intraday precision --labels v3 --variant k15_bcl             --window-months 1 --holdout-months 1 --min-train-rows 200             --max-train-rows 20000 | tee precision.txt
          grep -q "decile 1" precision.txt
          grep -q "top 1%" precision.txt
          uv run python -m market_intel.intraday report | tee report_v3.txt
          grep -q "vs none" report_v3.txt
          uv run python -m market_intel.intraday replay --labels v3 --variant k15_bcl             --capital 100000 | tee replay_v3.txt
          grep -qE "charges paid|no signals" replay_v3.txt

      # S5i-c: choosing a second universe from the daily candles, and proving the two
      # universes keep their own Parquet months and their own resume point.
      - name: Universe selection and a second universe on fake data
        env:
          ALERT_DRY_RUN: "true"
        run: |
          uv run python -m market_intel.intraday select-universe --name zzmovers --size 3             --source nifty50 --min-turnover-crore 0 --history-before 2022-06-01 \n            --dry-run | tee select_dry.txt
          grep -q "DRY RUN" select_dry.txt
          uv run python -m market_intel.intraday select-universe --name zzmovers --size 3             --source nifty50 --min-turnover-crore 0 --history-before 2022-06-01 \n            | tee select.txt
          grep -q "rows written to universe_members: 3" select.txt
          uv run python -m market_intel.intraday features build --universe zzmovers
          uv run python -m market_intel.intraday labels build --version v2 --universe zzmovers
          test -d data/features/intraday/zzmovers/v1
          test -d data/features/intraday/nifty50/v1
          uv run python -m market_intel.intraday backtest --universe zzmovers --labels v2             --variant k15_b10 --capital 100000 | tee backtest_zz.txt
          grep -q "no_trading" backtest_zz.txt

      # S3: walk-forward training, baselines after costs, SHAP, MLflow and the registry on the
      # same synthetic data (both fake sectors are small, so only the pooled model trains).
      - name: Models train and report on fake data
        env:
          ALERT_DRY_RUN: "true"
        run: |
          uv run python -m market_intel.models train --horizon 21
          uv run python -m market_intel.models report

      - name: Database check
        env:
          ALERT_DRY_RUN: "true"
        run: uv run python -m market_intel.db_check

      # The daily health check against Docker: JSON output, and no check may FAIL.
      - name: Health check (JSON, no FAIL)
        env:
          ALERT_DRY_RUN: "true"
        run: |
          # "|| true": always print the table below; the jq -e line decides pass/fail.
          uv run python -m market_intel.health --json > health.json || true
          jq -r '.checks[] | "\(.status)  \(.name)  \(.message)"' health.json
          jq -e '[.checks[] | select(.status == "FAIL")] | length == 0' health.json

      - name: Stop databases
        if: always()
        run: docker compose -f docker/compose.yaml --env-file docker/compose.env down -v
