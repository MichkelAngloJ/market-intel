# RSS feeds read by `python -m market_intel.news fetch` (task 1.2; decisions 2026-11-22).
#
# Legitimate channels only: public RSS, fetched with an honest user agent, at most once per
# min_interval_minutes per feed, with conditional requests and a size cap. Item links (article
# pages, PDFs) are never followed. Moneycontrol is excluded: it blocks non-browser clients.
#
# Fields: name (lower-case, unique; the item source tag is "rss:<name>"), url (https), kind
# ("news" or "exchange"), publisher, min_interval_minutes (default 10), enabled (default true).
# Disable a feed that breaks (enabled = false) until its parser is fixed.

# --- news ---

[[feed]]
name = "et_markets"
url = "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
kind = "news"
publisher = "Economic Times"

