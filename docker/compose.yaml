# Local databases for the HP (and later the ARM VM). Same major versions as the cloud
# testing setup: Postgres 18 (Neon) and MongoDB 8.0 (Atlas). Both images are multi-arch.
#
#   docker compose -f docker/compose.yaml --env-file docker/compose.env up -d
#
# Credentials come from docker/compose.env (git-ignored; see compose.env.example).
name: market-intel

services:
  postgres:
    # Plain Postgres, no TimescaleDB (decision 2026-11-18).
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in docker/compose.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/compose.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in docker/compose.env}
      # Read by postgres-init/01-app-role.sh to create the limited app login mi_app.
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:?set PG_APP_PASSWORD in docker/compose.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/18/docker: mount the parent.
      - pgdata:/var/lib/postgresql
      # Scripts here run once, on first start with an empty data volume.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # Cap the WiredTiger cache so it fits inside the 2 GB container limit.
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set in docker/compose.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set in docker/compose.env}
      # Read by mongo-init/01-app-user.js to create the least-privilege app user.
      MONGO_APP_USER: ${MONGO_APP_USER:?set MONGO_APP_USER in docker/compose.env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in docker/compose.env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
      # Scripts here run once, on first start with an empty data volume.
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  mongodata:
